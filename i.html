<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUMP に招待されたよ</title>
<meta property="og:title" content="PUMP に招待されたよ 💪">
<meta property="og:description" content="筋トレの記録はチャットで送るだけ。友達と記録を見せ合う筋トレのSNS。">
<meta property="og:image" content="https://taiyo505-prog.github.io/pump-videos/icon.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--acc:#ff5a1f;--bg:#0d0d10;--panel:#18181e;--ink:#fff;--sub:#9a9aa5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,rgba(255,90,31,.25),transparent 50%),var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:48px 20px 40px;text-align:center}
img{width:96px;height:96px;border-radius:22px}
.logo{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800;font-size:56px;color:var(--acc);line-height:1;margin-top:10px}
h1{font-size:22px;font-weight:900;line-height:1.5;margin:22px 0 6px}
p{color:var(--sub);font-size:14px;line-height:1.7;margin:0}
.code{margin:24px auto 0;background:var(--panel);border:1px solid #2a2a33;border-radius:16px;padding:16px}
.code small{display:block;color:var(--sub);font-size:12px}
.code b{display:block;font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:40px;letter-spacing:.12em;margin-top:2px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:900;margin-top:14px;text-decoration:none;font-family:inherit;cursor:pointer}
.main{background:var(--acc);color:#fff}
.sub{background:var(--panel);color:var(--ink);border:1px solid #2a2a33}
.steps{text-align:left;background:var(--panel);border-radius:16px;padding:16px 18px;margin-top:26px;font-size:14px;line-height:1.8}
.steps b{color:var(--acc)}
.msg{min-height:20px;margin-top:10px;color:var(--acc);font-size:13px}
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <div class="logo">PUMP</div>
  <h1 id="ttl">PUMP に招待されたよ</h1>
  <p>筋トレの記録はチャットで送るだけ。<br>友達と記録を見せ合う、筋トレのSNS。</p>
  <div class="code"><small>フレンドコード</small><b id="code">-</b></div>
  <a class="btn main" id="open" href="#">アプリで開いて友達になる</a>
  <button class="btn sub" id="copy" type="button">フレンドコードをコピー</button>
  <div class="msg" id="msg"></div>
  <div class="steps">
    <b>アプリをまだ入れてない人</b><br>
    <span id="store">PUMP は近日リリース。もう少し待っててな💪</span><br>
    入れたあとにこのページの「アプリで開いて友達になる」を押すか、<br>
    アプリの「友達」→「友達を追加」にコードを入れてね。
  </div>
</main>
<script>
// ストアのページができたらここに入れる
var STORE = { ios: '', android: '' };
var q = new URLSearchParams(location.search);
var code = (q.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
var name = (q.get('n') || '').slice(0, 30);
document.getElementById('code').textContent = code || '-';
if (name) document.getElementById('ttl').textContent = name + ' さんから PUMP に招待されたよ';
document.getElementById('open').href = 'pump://invite?c=' + encodeURIComponent(code);
document.getElementById('copy').onclick = function () {
  var m = document.getElementById('msg');
  if (!code) return;
  (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { m.textContent = 'コピーしたよ'; }, function () { m.textContent = 'コード: ' + code; });
};
var ua = navigator.userAgent, link = /iPhone|iPad|iPod/.test(ua) ? STORE.ios : /Android/.test(ua) ? STORE.android : '';
if (link) document.getElementById('store').innerHTML = '<a class="btn sub" href="' + link + '">ストアで PUMP を入れる</a>';
</script>
</body>
</html>
