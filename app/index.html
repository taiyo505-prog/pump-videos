<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PUMP</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PUMP">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--bg:#000;--panel:#0e0e0f;--ink:#fff;--sub:#8e8e93;--line:#262628;--acc:#ff5a1f;--accink:#0a0a0a;--me:#ff5a1f;--meink:#0a0a0a;--bot:#161618;
--F:'Barlow Condensed','Zen Kaku Gothic New',sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* チャット画面 */
#app{height:calc(100% - var(--ad-h,0px));display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{padding:14px 72px 12px 18px;background:#000;border-bottom:1px solid var(--line)}
.lab{font-size:12px;color:var(--sub)}
.big{font-family:var(--F);font-weight:700;font-style:italic;font-size:56px;line-height:1;letter-spacing:.01em;color:var(--acc)}
.big small{font-size:20px;margin-left:4px;color:var(--sub);font-weight:600}
#prof{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lg{font-family:var(--F);font-style:italic;font-weight:700;font-size:56px;line-height:.95;letter-spacing:.02em;color:var(--acc)}
.lgt{font-family:var(--F);font-weight:600;font-size:13px;letter-spacing:.3em;color:var(--sub)}
#cd{position:fixed;inset:0;z-index:9;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#cd.on{display:flex}
#cd b{font-family:var(--F);font-style:italic;font-weight:700;font-size:220px;line-height:1;color:var(--acc);animation:cdn 1s ease-out both}
#cd b.go{font-size:150px;color:#fff}
#cd span{font-size:13px;color:var(--sub);letter-spacing:.2em}
@keyframes cdn{0%{transform:scale(1.7);opacity:0}18%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.92);opacity:.15}}
@media (prefers-reduced-motion:reduce){#cd b{animation:none}}
#log{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 13px;border-radius:18px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.me{align-self:flex-end;background:var(--me);color:var(--meink);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.bot b{font-family:var(--F);font-size:20px}
.bot .ch{display:block;font-size:12px;letter-spacing:.12em;color:var(--acc);font-weight:700;font-family:inherit}
.pr{color:var(--acc);font-weight:700}
.m table{border-collapse:collapse;margin:6px 0;font-size:14px}
.m td,.m th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.m th{color:var(--sub);font-weight:400}
.hb2{display:block;margin-top:8px;border:0;background:var(--acc);color:var(--accink);border-radius:10px;padding:8px 14px;font-weight:700}
#tm{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line);font-weight:700}
#tm[hidden]{display:none}
#tt{font-size:20px;font-style:italic}
#tw{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0;white-space:nowrap;line-height:1.1}
#tl{font-size:13px;color:var(--sub);font-weight:700;font-variant-numeric:tabular-nums}
#tb{border:1px solid var(--line);background:var(--bot);color:var(--ink);padding:8px 12px;border-radius:10px;font-size:15px;font-weight:700;white-space:nowrap}
.rrow{display:inline-flex;flex-wrap:wrap;gap:6px;margin-top:6px;vertical-align:middle}
.tot{color:var(--sub);font-size:13px}.tot b{color:var(--ink);font-size:15px}
.rrow button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--ink)}
.rrow button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
#tb.rs{background:#2a1a12;color:var(--acc);border-color:#2a1a12}
#tb.rd{background:var(--acc);color:var(--accink)}
/* セット終わり: 休憩タイマーのスタートと、トレーニング時間のラップを1つのボタンで */
/* セット終わり: 押すと休憩タイマーだけ先に始まる（記録はあとで打てばいい） */
#br{border:0;background:var(--acc);color:var(--accink);border-radius:10px;padding:9px 14px;font-size:15px;font-weight:800;white-space:nowrap}
/* 休憩時間の選択（休憩のボタンを押したときだけ出る） */
#brs{flex-basis:100%;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);overflow-x:auto;scrollbar-width:none}
#brs[hidden]{display:none}
/* 幅の狭いスマホ（iPhone SE 初代・小さい Android）では、時間の段の文字とボタンを少し小さく */
@media (max-width:359px){#tm{padding:8px 10px;gap:6px}#tt{font-size:17px}#tl{font-size:11px}#tb{padding:7px 8px;font-size:13px}#br{padding:8px 10px;font-size:14px}}
#tb.off{background:none;border:1px dashed var(--line);color:var(--sub);font-size:13px;padding:7px 10px}
#brs::-webkit-scrollbar{display:none}
#brs span{flex:none;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#brs button{flex:none;border:1px solid var(--line);background:var(--bot);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13px}
#brs button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
/* 時間のところをタップすると、時間の段が画面の半分くらいまで大きくなる（もう一度タップで戻る） */
#tw{cursor:pointer}
#tt::after{content:' ⤢';font-size:12px;font-style:normal;color:var(--sub)}
#tm.big{min-height:46vh;align-content:center;gap:14px;padding:16px 16px 18px;position:relative}
#tm.big{cursor:pointer;padding-top:48px}
#tms{display:none}
#tm.big #tms{display:block;position:absolute;top:10px;right:12px;border:1px solid var(--line);background:var(--bot);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
#tm.big #tw{flex-basis:100%;align-items:center;line-height:1.15}
#tm.big #tt{font-size:52px;font-variant-numeric:tabular-nums}
#tm.big #tt::after{content:''}
#tm.big #tl{font-size:24px;margin-top:6px}
#tm.big #tb,#tm.big #br{flex:1;min-height:60px;font-size:20px;border-radius:14px}
#tm.big #tb.rs,#tm.big #tb.rd{font-size:26px}
#tm.big #brs{justify-content:center}
#qk{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;background:var(--panel);border-top:1px solid var(--line);scrollbar-width:none}
#qk::-webkit-scrollbar{display:none}
#qk[hidden]{display:none}
#qk button{flex:none;border:1px solid var(--line);background:var(--bot);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
#qk .q1{border-color:var(--acc);color:var(--acc)}
#bar{display:flex;gap:8px;padding:10px 12px 12px;background:var(--panel);border-top:1px solid var(--line)}
#qk:not([hidden])+#bar{border-top:0}
/* 自己ベストの紙吹雪 */
.cf{position:fixed;top:-12px;width:8px;height:12px;border-radius:2px;z-index:200;pointer-events:none;animation:cf 1.6s ease-in forwards}
@keyframes cf{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
.prb{margin-top:8px}
/* 今トレーニング中の友達 */
.live{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:10px 12px 8px}
.lvh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:8px}
.lvd{width:8px;height:8px;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 0 rgba(255,59,48,.6);animation:lvp 1.6s infinite}
@keyframes lvp{70%{box-shadow:0 0 0 7px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
.lvr{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:5px 4px 2px}
.lvp{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--ink);padding:0;width:62px}
.lvp .av{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--acc)}
.lvp b{font-size:12px;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvp .lvt{font-size:11px;color:var(--acc);font-weight:700}
/* 自己ベストのお知らせ */
.ach{padding:12px 14px;border-color:#5a3418;background:linear-gradient(135deg,rgba(255,90,31,.16),rgba(255,216,77,.06)),var(--panel)}
.ach1{display:flex;gap:10px;align-items:center}
.ach2{font-size:14px}.ach3{font-size:15px;margin-top:2px}.ach3 b{font-family:var(--F);font-size:22px;color:var(--acc)}
.chr{margin-top:8px;border:1px solid var(--line)!important}.chr.on{border-color:var(--acc)!important;color:var(--acc)}
/* スタンプ */
.qst{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:6px 0 4px}
.qst button{flex:none;border:1px solid var(--line);background:var(--bot);border-radius:12px;padding:3px}
.stp{display:inline-block;vertical-align:middle;margin:2px 0}
.chn{margin-top:8px}
.cl.cls{align-items:center}
/* 月間バトル */
.rpt{margin:6px 0 4px}
.champ{background:linear-gradient(90deg,rgba(255,216,77,.18),transparent);border-left:3px solid #ffd84d;border-radius:6px;padding:8px 10px;margin:8px 0;font-size:14px}
.rk b small{font-size:11px;color:var(--sub);font-weight:400;margin-left:2px}
.mmap{display:flex;justify-content:center;gap:10px;color:var(--sub);margin:4px 0 8px}
.mleg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:12px;color:var(--sub);margin-bottom:6px}
.mleg span{display:inline-flex;align-items:center;gap:4px}.mleg b{color:var(--ink)}
.mleg i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:14px;height:15px;border-radius:4px;font-size:10px;font-weight:900;line-height:1;color:#111}
.mrb{display:flex;gap:8px;flex-wrap:wrap}
#pk{background:var(--panel);padding:8px 12px 0;max-height:46vh;overflow-y:auto}
#pk[hidden]{display:none}
#pk .kh{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
#pk .kh b{font-size:15px}
#pk .kh .ksp{flex:1}
#pk .kh button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12px}
#pk .kg2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#pk .kg2 button{border:1px solid var(--line);background:var(--bot);color:var(--ink);border-radius:12px;padding:10px 0;font-size:15px;font-weight:700}
#pk .kg2 button.on{border-color:var(--acc);color:var(--acc)}
#pk .kg2 button.kw{grid-column:span 2;font-weight:400;font-size:13px}
#pk .kt{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
#pk .kt button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px}
#pk .kt button.on{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:700}
#pk .kl{display:flex;flex-wrap:wrap;gap:6px}
#pk .kl button{border:1px solid var(--line);background:var(--bot);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px}
#pk .kn{font-size:12px;color:var(--sub);margin:8px 0 2px}
#pk:not([hidden])~#bar{border-top:0}
#in{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px}
#send{border:0;background:var(--acc);color:var(--accink);border-radius:12px;padding:0 18px;font-weight:700}
#in:disabled,#send:disabled{opacity:.4}

/* トレーニングのまとめ */
.m:has(.rc){max-width:100%;width:100%}
.rt{font-family:var(--F);font-style:italic;font-weight:700;font-size:30px;letter-spacing:.03em;color:#fff;line-height:1.1}
.rj{font-size:12px;color:var(--acc);margin:2px 0 10px;font-weight:700}
.rn{font-family:var(--F);font-style:italic;font-weight:700;font-size:56px;line-height:1;color:#fff}
.rl{font-size:11px;letter-spacing:.22em;color:var(--sub);margin-bottom:10px}
.rg{display:flex;gap:20px;margin:8px 0}
.rg b{display:block;font-family:var(--F);font-style:italic;font-size:28px;line-height:1}
.rg span{font-size:10px;letter-spacing:.16em;color:var(--sub)}
.ex{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.en{font-weight:700;font-size:14px;flex:none;max-width:44%}
.en i{font-style:normal;font-size:11px;color:var(--sub);font-weight:400}
.sets{display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:flex-end}
.sets span{font-size:12px;color:var(--sub)}
.sets b{color:var(--acc);font-family:var(--F);font-style:italic;font-size:15px}

/* ホーム */
#st{position:fixed;inset:0 0 var(--ad-h,0px);background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:3;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#st.on{display:flex}
.sk{letter-spacing:.32em;color:var(--sub);font-size:12px}
#stb{width:180px;height:180px;border-radius:50%;border:0;background:var(--acc);color:#0a0a0a;font-family:var(--F);font-weight:700;font-style:italic;font-size:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(255,90,31,.2),0 0 0 32px rgba(255,90,31,.08)}
#stb small{font-size:14px;font-style:normal;font-family:'Zen Kaku Gothic New',sans-serif;margin-top:2px}
#sth{background:none;border:0;color:var(--sub);text-decoration:underline;text-underline-offset:4px}
#sl{font-size:13px;color:var(--sub);text-align:center;min-height:1.6em}
#sf{border:1px solid var(--line);background:var(--bot);border-radius:999px;padding:8px 16px;font-size:13px;max-width:calc(100% - 40px);display:flex;align-items:center;gap:6px}
#sf[hidden]{display:none}
#sf b{color:var(--acc)}

/* 全画面ページ（履歴・友達・統計など） */
.pg{position:fixed;inset:0 0 var(--ad-h,0px);background:var(--bg);display:none;flex-direction:column;z-index:4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pg.on{display:flex}
.ph{display:flex;align-items:center;gap:8px;min-height:68px;padding:12px 68px 12px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.ph h1{font-size:20px;margin:0;flex:1}
.bk{width:40px;height:40px;border-radius:20px;border:0;background:none;color:var(--sub);font-size:30px;line-height:1;padding:0}
#plus{width:44px;height:44px;border-radius:22px;border:0;background:var(--acc);color:var(--accink);font-size:28px;line-height:1;padding:0}
.pl{flex:1;overflow-y:auto;padding:14px;max-width:640px;width:100%;margin:0 auto}
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.dt{display:block;width:100%;text-align:left;border:0;background:none;font-weight:700;padding:14px}
.dd{padding:0 14px 12px;overflow-x:auto}
.kcal{padding:12px 10px 10px}
.kch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.kch div{text-align:center}.kch b{display:block;font-size:16px}.kch span{font-size:12px;color:var(--sub)}
.kch button{border:0;background:none;font-size:26px;line-height:1;padding:4px 14px;color:var(--ink)}
.kch button:disabled{opacity:.25}
.kcw,.kcg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.kcw span{font-size:11px;color:var(--sub);padding-bottom:2px}
.kcw span:first-child{color:#ff6b6b}.kcw span:last-child{color:#6ba8ff}
.kcd{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:46px;padding:5px 1px 3px;border:0;border-radius:10px;background:none;color:var(--ink);min-width:0}
.kcd b{font-size:14px;font-weight:600;line-height:1.2}
.kcd small{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:4px;max-width:100%}
.kcd i,.kclg i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:14px;height:15px;border-radius:4px;font-size:10px;font-weight:900;line-height:1;color:#111}
.kclg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--sub)}
.kclg span{display:inline-flex;align-items:center;gap:4px}
.kcd.on{background:var(--bot);box-shadow:inset 0 0 0 1px var(--line)}
.kcd.on b{font-weight:800}
.kcd.td{box-shadow:inset 0 0 0 2px var(--acc)}.kcd.td b{color:var(--acc)}
.kcd.sel{background:var(--panel);box-shadow:inset 0 0 0 2px var(--ink)}
.gc{padding:12px}
.gc h2{font-size:15px;margin:0 0 8px}
.gc svg{display:block}
.gc .cw{white-space:pre-wrap;font-size:14px}
.gs{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px;font:inherit;margin-bottom:8px}
.gc textarea{width:100%;height:90px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px;font:inherit;font-size:12px;margin:8px 0}
.pth{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.pth img{width:96px;border-radius:10px}
.fn{font-size:13px;color:var(--sub);margin:6px 0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fp img{width:100%;border-radius:12px;display:block}
.fp div{font-weight:700;font-size:13px;margin-top:4px}
.fp span{font-size:12px;color:var(--sub)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv b{display:block;font-family:var(--F);font-style:italic;font-size:28px;line-height:1.1;color:var(--acc)}
.kv span{font-size:11px;color:var(--sub)}
.br{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.br>span{width:2.6em;color:var(--sub);flex:none}
.br>div{flex:1;background:var(--bot);border-radius:5px;height:10px;overflow:hidden}
.br i{display:block;height:100%;background:var(--acc);border-radius:5px}
.br b{width:3.2em;text-align:right;font-family:var(--F);font-style:italic;font-size:17px}
.pl table{border-collapse:collapse;font-size:14px;width:100%}
.pl td,.pl th{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);text-align:left}
.pl th{color:var(--sub);font-weight:400}
.hp p{margin:0 0 10px;font-size:14px}
.hp code{background:var(--bot);border-radius:6px;padding:1px 6px;font-family:inherit;color:var(--acc)}

/* 設定・はじめに */
#ov{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;z-index:5;overflow:auto}
#ov.on{display:flex}
#card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
#card h1{font-size:20px;margin:0 0 4px}
#card>p{margin:0 0 16px;color:var(--sub);font-size:14px}
#card label{display:block;font-size:13px;color:var(--sub);margin-bottom:12px}

<script>
(function(){
'use strict';
function $(id){return document.getElementById(id)}

// ---- 保存 ----
var K={data:'workout-chat-v1',prof:'workout-profile-v1',ses:'workout-session-v1',sesAll:'workout-sessions-v1',chats:'workout-chats-v1',photos:'workout-photos-v1',rest:'pump-rest-by-exercise-v1',body:'workout-body-v1'};
function get(k,def){try{var s=localStorage.getItem(k);return s?JSON.parse(s):def}catch(e){return def}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
var data=get(K.data,[]),profile=get(K.prof,null),ses=get(K.ses,null),sesAll=get(K.sesAll,[]),chats=get(K.chats,{}),photos=get(K.photos,{}),body=get(K.body,[]),restBy=get(K.rest,{});
if(!Array.isArray(data))data=[];if(!Array.isArray(sesAll))sesAll=[];if(!Array.isArray(body))body=[];
if(!chats||typeof chats!=='object')chats={};if(!photos||typeof photos!=='object')photos={};
if(!restBy||typeof restBy!=='object')restBy={};
if(profile&&!body.length)body.push({t:Date.now(),h:profile.h,w:profile.w});
function save(){put(K.data,data);put(K.prof,profile)}
function sSave(){put(K.ses,ses);put(K.sesAll,sesAll)}
function cSave(){put(K.chats,chats)}
// 身長・体重の変化を日ごとに1件だけ残す
function logBody(h,w){var t=Date.now(),last=body[body.length-1];if(last&&dkey(last.t)===dkey(t))body[body.length-1]={t:t,h:h,w:w};else body.push({t:t,h:h,w:w});put(K.body,body)}

// ---- 小物 ----
var log=$('log'),inp=$('in'),profEl=$('prof'),ov=$('ov'),tmEl=$('tm'),ttEl=$('tt'),stOn=!ses,lastCid=null,shPh=null,camFor=null,shBlob=null,shText='',armed=false;
var D=864e5;
function emit(n,d){try{document.dispatchEvent(new CustomEvent(n,{detail:d||{}}))}catch(e){}}
function norm(s){return s.replace(/[０-９．]/g,function(c){return c==='．'?'.':String.fromCharCode(c.charCodeAt(0)-0xFEE0)})}
function r1(n){return Math.round(n*10)/10}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function md(t){var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()}
function hms(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s=s%60;return (h?h+':'+('0'+m).slice(-2):m)+':'+('0'+s).slice(-2)}
function dayStart(t){var d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function headOf(n){return String(n).replace(/[\s+＋0-9０-９].*$/,'').trim()}
function kind(n){var hd=headOf(n);if(BWN[hd])return'bw';if(!EXN[hd]&&/ディップ|dips?\b|懸垂|チンニング|チンアップ|プルアップ|pull.?ups?|chin.?ups?/i.test(n))return'bw';if(/ダンベル|dumbbell|\bdb\b/i.test(n)&&/プレス|press/i.test(n))return'db';if(/ナロー|クローズ|narrow|close.?grip/i.test(n))return'narrow';if(/ベンチ|bench/i.test(n))return'bench';return'other'}
